<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="自分の路線の混み具合をワンタップで記録して、空いている時間帯を見つける通勤・通学アプリ">
<title>すいてるログ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>すいてるログ</h1>
  <div class="route-row">
    <label for="route" class="sr-only">路線</label>
    <select id="route"></select>
    <button id="add-route" type="button" aria-label="路線を追加">＋</button>
    <button id="del-route" type="button" aria-label="この路線を削除">🗑</button>
  </div>
</header>

<main>
  <section aria-labelledby="h-rec">
    <h2 id="h-rec">いまの混み具合</h2>
    <div class="time-row">
      <label for="time">乗った時刻</label>
      <input id="time" type="time" step="60">
      <div class="chips">
        <button type="button" data-shift="-15">-15分</button>
        <button type="button" data-shift="-10">-10分</button>
        <button type="button" data-shift="-5">-5分</button>
        <button type="button" data-shift="0">今</button>
      </div>
    </div>
    <div class="levels" id="levels"></div>
    <p id="toast" role="status" aria-live="polite"></p>
    <details id="history">
      <summary>最近の記録</summary>
      <ul id="history-list"></ul>
    </details>
  </section>

  <section aria-labelledby="h-rec2">
    <h2 id="h-rec2">今日のおすすめ</h2>
    <div id="recommend"></div>
  </section>

  <section aria-labelledby="h-heat">
    <h2 id="h-heat">曜日×時間の傾向</h2>
    <div class="heat-wrap"><table id="heat"></table></div>
  </section>

  <section aria-labelledby="h-memo">
    <h2 id="h-memo">乗換メモ（号車・ドア位置）</h2>
    <ul id="memo-list" class="memo-list"></ul>
    <form id="memo-form" class="memo-form">
      <input id="memo-station" placeholder="駅" maxlength="20" required aria-label="駅名">
      <input id="memo-text" placeholder="5号車3ドア 階段が目の前" maxlength="100" required aria-label="メモ">
      <button type="submit">追加</button>
    </form>
  </section>

  <section aria-labelledby="h-data">
    <h2 id="h-data">データ（機種変更用）</h2>
    <p class="note">記録はこの端末の中だけに保存されています。</p>
    <div class="data-row">
      <button id="export" type="button">書き出す</button>
      <label class="file-btn">読み込む<input id="import" type="file" accept="application/json,.json"></label>
    </div>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
